name: Java CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Build and run tests
        run: mvn -B --no-transfer-progress -DfailIfNoTests=true -Dapi.version=1.40 verify
